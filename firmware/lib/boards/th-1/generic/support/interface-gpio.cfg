#
# SWD over the Raspberry Pi header (RP1) with user-chosen pins.
# No pins are defined here; call from west with:
#   --cmd-pre-init "th1_swd <swclk> <swdio> [srst]"
# Pin numbers are RP1 GPIO numbers.

adapter driver linuxgpiod

proc read_file { name } {
	if {[catch {open $name r} fd]} {
		return ""
	}
	set result [read $fd]
	close $fd
	return $result
}

proc find_rp1_alias {} {
	foreach f [glob -directory "/proc/device-tree/aliases" "gpio\[0-9\]"] {
		if {[string match "*/rp1/*" [read_file $f]]} {
			return $f
		}
	}
}

set th1_swd_configured 0

proc th1_swd { swclk swdio {srst ""} } {
	global th1_swd_configured

	set chip [string index [find_rp1_alias] end]
	if {$chip eq ""} {
		error "th1_swd: could not find the RP1 gpiochip"
	}

	adapter gpio swclk -chip $chip $swclk
	adapter gpio swdio -chip $chip $swdio

	if {$srst ne ""} {
		adapter gpio srst -chip $chip $srst
		reset_config srst_only srst_open_drain
	}

	set th1_swd_configured 1
}

# Refuse to touch any hardware until the SWD pins have been given.
rename init th1_orig_init
proc init {} {
	global th1_swd_configured
	if {!$th1_swd_configured} {
		error "SWD pins not set: pass --cmd-pre-init 'th1_swd <swclk> <swdio> \[srst\]'"
	}
	th1_orig_init
}
