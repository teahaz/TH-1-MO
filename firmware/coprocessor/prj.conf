CONFIG_LOG=y
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# TH_BLE
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y

# TH_Infrared
CONFIG_PWM=y
CONFIG_COUNTER=y


# Additional stack space for the main
# thread to handle long IR inputs
CONFIG_MAIN_STACK_SIZE=8192
